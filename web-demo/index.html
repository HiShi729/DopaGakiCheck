<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e14" />
  <title>ドパガキ診断 | DEMO</title>
  <style>
    :root { --bg:#0a0e14; --surf:#181f27; --line:#343f43; --fg:#f7f9f7; --muted:#9ca9ac; --lime:#c3f562; }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif; }
    button { font:inherit; cursor:pointer; }
    #app { min-height:100dvh; }
    .container { max-width:460px; margin:auto; min-height:100dvh; padding:50px 26px 38px; position:relative; }
    .intro { display:flex; flex-direction:column; justify-content:center; overflow:hidden; background:linear-gradient(145deg,#0a0e14,#142126); }
    .intro::before { content:""; display:block; position:absolute; top:5%; right:-57%; width:105%; aspect-ratio:1; border:1px solid rgba(195,245,98,.15); box-shadow:0 0 0 66px rgba(195,245,98,.015),0 0 0 136px rgba(195,245,98,.015),0 0 0 207px rgba(195,245,98,.01); border-radius:50%; pointer-events:none; }
    .kicker { color:var(--lime); font-size:12px; font-weight:800; letter-spacing:.12em; }
    h1,h2,p { margin:0; }
    .intro h1 { position:relative; margin:27px 0 16px; font-size:clamp(37px,10vw,46px); font-weight:900; line-height:1.4; letter-spacing:-.065em; }
    .description { font-size:15px; color:var(--muted); line-height:1.95; position:relative; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; margin:32px 0 36px; }
    .stats strong { display:block; font-size:26px; line-height:1.2; }
    .stats span { display:block; color:var(--muted); font-size:10px; letter-spacing:.06em; margin-top:8px; font-weight:750; }
    .btn { border-radius:16px; width:100%; border:1px solid var(--line); min-height:60px; padding:13px 16px; background:#293139; color:var(--fg); font-weight:750; }
    .btn-primary { border-color:var(--lime); background:var(--lime); color:var(--bg); }
    .btn:disabled { opacity:.46; cursor:not-allowed; }
    .info { font-size:12px; line-height:1.8; color:var(--muted); margin-top:16px; text-align:center; }
    .note { font-size:11px; line-height:1.7; color:var(--muted); margin-top:19px; text-align:center; }
    .feed { position:relative; width:100%; height:100dvh; background:#111719; overflow:hidden; touch-action:pan-x; }
    .feed-inner { width:100%; height:100%; position:relative; margin:auto; max-width:550px; }
    video { width:100%; height:100%; object-fit:cover; display:block; background:#161b21; }
    .shade-top { pointer-events:none; position:absolute; left:0; right:0; top:0; height:190px; background:linear-gradient(rgba(0,0,0,.67),transparent); }
    .shade-bottom { pointer-events:none; position:absolute; left:0; right:0; bottom:0; height:320px; background:linear-gradient(transparent,rgba(0,0,0,.93)); }
    .top-ui { position:absolute; top:0; left:0; right:0; padding:calc(34px + env(safe-area-inset-top)) 22px 0; pointer-events:none; }
    .top-row { display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:900; letter-spacing:.06em; }
    .segments { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:21px; }
    .segments span { background:rgba(255,255,255,.34); height:4px; border-radius:10px; }
    .segments span.active { background:var(--lime); }
    .bottom-ui { position:absolute; bottom:calc(25px + env(safe-area-inset-bottom)); left:0; right:0; padding:0 23px; }
    .clip-kicker { font-size:11px; color:var(--lime); font-weight:800; letter-spacing:.09em; }
    .clip-title { font-size:28px; font-weight:900; margin:8px 0 9px; }
    .clip-instruction { font-size:14px; line-height:1.75; }
    .bottom-actions { display:flex; align-items:center; justify-content:space-between; margin-top:19px; }
    .remaining { font-weight:800; font-size:15px; }
    .skip { color:white; font-weight:800; border:0; background:rgba(0,0,0,.65); border-radius:32px; padding:12px 17px; }
    .pause-mark { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:18px; background:#000b; padding:15px 20px; font-size:15px; font-weight:800; display:none; white-space:nowrap; pointer-events:none; }
    .quiz { background:linear-gradient(145deg,#0a0e14,#142126); }
    .quiz small { display:block; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.08em; margin-top:28px; }
    .quiz .segments { margin:13px 0 44px; }
    .question-clip { font-size:13px; font-weight:800; color:var(--lime); margin-bottom:10px; }
    .quiz h2 { line-height:1.4; letter-spacing:-.035em; font-size:clamp(25px,7vw,32px); font-weight:900; margin-bottom:30px; }
    .option { display:flex; width:100%; text-align:left; align-items:center; border:1px solid var(--line); border-radius:16px; min-height:68px; background:var(--surf); color:var(--fg); margin:12px 0; padding:10px 19px; font-size:18px; }
    .option b { flex:0 0 36px; color:var(--muted); font-size:15px; }
    .option.selected { background:#293d2b; border-color:var(--lime); }
    .option.selected b, .option.selected::after { color:var(--lime); }
    .option.selected::after { content:"●"; margin-left:auto; }
    .quit-top { position:absolute; top:48px; right:24px; border:0; background:none; color:var(--muted); font-size:13px; padding:7px 0 7px 9px; font-weight:700; }
    .quiz .btn { margin-top:22px; }
    .quiz .btn#quit { margin-top:12px; }
    .quiz-still { display:block; width:118px; height:210px; object-fit:cover; border-radius:13px; margin:0 auto 18px; }

    .result { background:linear-gradient(145deg,#0a0e14,#142126); }
    .result h2 { font-size:34px; margin:28px 0 32px; }
    .score-label { font-size:14px; color:var(--muted); }
    .score { display:flex; align-items:baseline; color:var(--lime); letter-spacing:-.07em; }
    .score strong { font-size:clamp(90px,24vw,110px); line-height:1.15; }
    .score span { font-size:40px; }
    .score-type { font-size:23px; font-weight:850; }
    .result .stats { border-top:1px solid var(--line); padding-top:25px; margin:26px 0 19px; }
    .mini { font-size:13px; color:var(--muted); line-height:2; }
    .foot { font-size:12px; line-height:1.85; color:var(--muted); margin:20px 0 25px; }
    .result .btn { margin-top:11px; }
    .review-title { font-size:26px; margin:43px 0 20px; }
    .review-card { border:1px solid var(--line); background:var(--surf); border-radius:15px; padding:18px; margin-bottom:12px; }
    .review-card header { color:var(--lime); font-size:13px; font-weight:800; margin-bottom:7px; }
    .review-card header.wrong { color:#f1a099; }
    .review-card h3 { font-size:16px; line-height:1.5; margin:0 0 12px; }
    .review-card p { font-size:13px; line-height:1.6; color:var(--muted); margin:6px 0; }
    @media (min-width:650px) {
      body { background:#060a0e; }
      .feed-inner { box-shadow:0 0 0 1px #25313a; }
      .intro,.quiz,.result { box-shadow:0 0 100px #152027; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script src="./game-engine.js"></script>
<script>
'use strict';
const Game = window.DopaGakiGame;
let session;
const app = document.querySelector('#app');
let mode='intro', clip=0, quiz=0, selected=-1, skipped=[], completed=[], played=[], pauses=0, pausedByUser=false;
function reset(){ session=Game.createSession();mode='intro';clip=0;quiz=0;selected=-1;skipped=Array(10).fill(false);completed=Array(10).fill(false);played=Array(10).fill(0);pauses=0;pausedByUser=false; }
const fmt=n=>String(n).padStart(2,'0');
const bars=n=>'<div class="segments">'+Array.from({length:10},(_,i)=>'<span class="'+(i<=n?'active':'')+'"></span>').join('')+'</div>';
const stats=(fields)=>'<div class="stats">'+fields.map(([n,t])=>`<div><strong>${n}</strong><span>${t}</span></div>`).join('')+'</div>';
const reminder='これはゲーム内スコアであり、ドーパミン量、集中力、依存症を医学・心理学的に判定するものではありません。';
function renderIntro(){
 mode='intro';
 app.innerHTML=`<main class="container intro"><div class="kicker">DOPA / MEMORY EXPERIMENT</div><h1>退屈を、<br>覚えていますか。</h1>
 <p class="description">地味な動画を10本、ランダムな順番で。全部で3分。<br>見終わったら、内容と順番をどれだけ覚えているかテストします。</p>
 ${stats([['10','VIDEOS'],['180','SECONDS'],['10','QUESTIONS']])}
 <button class="btn btn-primary" id="start">テストをはじめる　→</button>
 <p class="info">上にスワイプしてスキップできます。<br>クイズも途中終了できます。音声・通信は不要です。</p>
 <p class="note">※ ${reminder}</p></main>`;
 document.querySelector('#start').onclick=()=>renderFeed();
}
function finishClip(wasSkipped){
 if(mode!=='feed')return;
 const video=document.querySelector('#clip-video');
 if(video) played[clip]=wasSkipped?Math.min(18,video.currentTime):18;
 completed[clip]=!wasSkipped; skipped[clip]=wasSkipped;
 clip++;
 renderFeed();
}
function renderFeed(){
 if(clip>=10){quiz=0;selected=-1;renderQuiz();return;}
 mode='feed';pausedByUser=false;
 app.innerHTML=`<section class="feed"><div class="feed-inner" id="feed-inner">
 <video id="clip-video" muted playsinline autoplay preload="auto" src="./clips/clip${fmt(session.videoOrder[clip]+1)}.mp4"></video>
 <div class="shade-top"></div><div class="shade-bottom"></div>
 <div class="top-ui"><div class="top-row"><span>DOPA / FEED</span><span>${fmt(clip+1)} / 10</span></div>${bars(clip)}</div>
 <div class="pause-mark" id="pause-mark">一時停止 · タップで再開</div>
 <div class="bottom-ui"><div class="clip-kicker">ORIGINAL · DAILY LIFE</div><div class="clip-title">CLIP　${fmt(clip+1)}</div>
 <div class="clip-instruction">上にスワイプして次へ<br>最後まで再生すると自動で進みます</div>
 <div class="bottom-actions"><div class="remaining" id="remaining">00:18</div><button class="skip" id="skip">スキップ ↑</button></div></div></div></section>`;
 const video=document.querySelector('#clip-video');
 video.onended=()=>finishClip(false);
 video.ontimeupdate=()=>{ const v=Math.max(0,Math.ceil(18-video.currentTime)); document.querySelector('#remaining').textContent='00:'+fmt(v); };
 video.onerror=()=>{ alert('動画が再生できません。web-demoフォルダの中身をまとめて配置してください。'); };
 video.play().catch(()=>{pausedByUser=true; document.querySelector('#pause-mark').style.display='block';});
 document.querySelector('#skip').onclick=()=>finishClip(true);
 let down=null;
 const surface=document.querySelector('#feed-inner');
 surface.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=[e.clientX,e.clientY];});
 surface.addEventListener('pointerup',e=>{
   if(!down || e.target.closest('button'))return;
   const dx=e.clientX-down[0],dy=e.clientY-down[1];down=null;
   if(Math.abs(dy)>74 && Math.abs(dy)>Math.abs(dx)*1.2){
     if(dy<0)finishClip(true);
     else alert('前の動画には戻れません。');
   } else if(Math.abs(dx)<35 && Math.abs(dy)<35){
     if(video.paused){ pausedByUser=false;video.play(); document.querySelector('#pause-mark').style.display='none'; }
     else {video.pause();pauses++;pausedByUser=true;document.querySelector('#pause-mark').style.display='block';}
   }
 });
}
function renderQuiz(){
 mode='quiz';const q=session.questions[quiz];
 app.innerHTML=`<main class="container quiz"><div class="kicker">DOPA / QUIZ</div><button class="quit-top" id="quit-top">途中終了 ×</button><small>QUESTION　${fmt(quiz+1)} / 10</small>${bars(quiz)}
 <div class="question-clip">${q.isOrderQuestion?'動画の順番に関する問題':'動画の内容に関する問題'}</div>
 ${q.isOrderQuestion?`<img class="quiz-still" src="./stills/still${fmt(q.videoId+1)}.jpg" alt="今回流れた動画の静止画" />`:''}
 <h2>${q.prompt}</h2>
 ${q.options.map((v,i)=>`<button class="option ${selected===i?'selected':''}" data-answer="${i}"><b>${'ABCD'[i]}</b>${v}</button>`).join('')}
 <button class="btn btn-primary" id="next" ${selected<0?'disabled':''}>${quiz===9?'結果を見る　→':'回答を確定して次へ　→'}</button>
 <button class="btn" id="quit">ここでクイズをやめる</button>
 <p class="info">途中終了時は未回答が不正解になり、ドパガキ度に10ポイント加算されます。</p></main>`;
 document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{selected=Number(btn.dataset.answer);renderQuiz();});
 document.querySelector('#next').onclick=()=>{if(selected<0)return;Game.submitAnswer(session,quiz,selected);quiz++;selected=-1;if(quiz===10)renderResult();else renderQuiz();};
 const quitHandler=()=>{
  if(window.confirm('現在の確定回答: '+Game.answeredCount(session)+'/10問\n未回答は不正解、途中終了ペナルティ+10ポイントで採点します。終了しますか？')){
   Game.quitQuiz(session);renderResult();
  }
 };
 document.querySelector('#quit').onclick=quitHandler;
 document.querySelector('#quit-top').onclick=quitHandler;
}
function resultLabel(score){return score<=20?'記憶力ばっちり':score<=40?'じっくり観察タイプ':score<=60?'なんとなくスワイパー':score<=80?'刺激が恋しいタイプ':'高速スワイパー';}
function count(arr){return arr.filter(Boolean).length;}
function resultText(){const n=Game.correctCount(session);
 return `ドパガキ診断（エンタメ)\nドパガキ度: ${Game.dopaScorePercent(session)}%\nクイズ: ${n}/10問正解（${Game.answeredCount(session)}/10問回答）\nクイズ: ${session.finishedEarly?'途中終了':'完走'}\n動画スキップ: ${count(skipped)}/10本\n※医学・心理学的な診断ではありません。`;
}
function renderResult(){
 mode='result';const n=Game.correctCount(session),score=Game.dopaScorePercent(session),pct=Game.overallAccuracyPercent(session);
 app.innerHTML=`<main class="container result"><div class="kicker">DOPA / RESULT</div><h2>診断結果</h2>
 <div class="score-label">ドパガキ度（ゲーム内スコア）</div><div class="score"><strong>${score}</strong><span>%</span></div>
 <div class="score-type">${resultLabel(score)}${session.finishedEarly?' · クイズ途中終了':''}</div>
 ${stats([[n+'/10','正解数'],[pct+'%','全10問の正答率'],[count(skipped)+'/10','スキップ']])}
 <div class="mini">クイズ: ${session.finishedEarly?'途中終了':'10問完走'}（回答 ${Game.answeredCount(session)}/10問）<br>動画を最後まで再生: ${count(completed)}/10本<br>再生した長さ（概算）: ${Math.floor(played.reduce((a,b)=>a+b,0))}/180秒<br>一時停止操作: ${pauses}回</div>
 <p class="foot">ドパガキ度 = min(100, 100 − 正答率 + 途中終了なら10)。未回答は不正解です。途中終了の原因も判定できません。${reminder}</p>
 <button class="btn btn-primary" id="share">結果をシェア　↗</button>
 <button class="btn" id="copy">結果をコピー</button><button class="btn" id="again">もう一度チャレンジ</button>
 <h3 class="review-title">答え合わせ</h3>
 ${session.questions.map((q,i)=>{const a=session.answers[i],unanswered=a<0,correct=!unanswered&&a===q.correctIndex;
  const status=unanswered?'未回答':(correct?'正解':'不正解');
  return `<article class="review-card"><header class="${correct?'':'wrong'}">Q${fmt(i+1)} · ${q.isOrderQuestion?'順番問題':'内容問題'} · ${status}</header>
 <h3>${q.prompt}</h3><p>あなたの回答: ${unanswered?'未回答':q.options[a]}</p><p>正解: ${q.options[q.correctIndex]}</p><p>${q.explanation}</p></article>`;}).join('')}</main>`;
 document.querySelector('#again').onclick=()=>{reset();renderIntro();};
 document.querySelector('#copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(resultText()); alert('コピーしました');}
  catch{window.prompt('結果を選択してコピーしてください',resultText());}
 };
 document.querySelector('#share').onclick=async()=>{
  if(navigator.share){try{await navigator.share({title:'ドパガキ診断',text:resultText()});}catch{}}
  else document.querySelector('#copy').click();
 };
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden && mode==='feed'){
  const v=document.querySelector('#clip-video');if(v&&!v.paused){v.pause();pausedByUser=true;}
 }
});
window.addEventListener('keydown',e=>{ if(mode==='feed'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();if(e.key==='ArrowDown')finishClip(true);} });
reset();renderIntro();
</script>
</body>
</html>
